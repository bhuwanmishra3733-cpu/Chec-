name: Build Vampire Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name "settings.gradle*"

      - name: Build APK
        run: gradle assembleDebug
